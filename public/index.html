<!doctype html>
<html lang="ja">
  <meta charset="utf-8" /><title>音声入力</title>
  <h1>音声入力</h1>
  <p>
    チャット入力欄のマイクボタンで音声入力できます。認識した文章は下書きへ反映され、自動送信されません。
  </p>
  <p>
    リモート利用はTailscale
    ServeのHTTPS接続を前提としています。HTTP接続では通常の文字入力を利用してください。
  </p>
  <p>
    対応状況はブラウザ・OSによって異なります。音声はブラウザ提供元の認識サービスへ送信される場合があります。
  </p>
</html>
